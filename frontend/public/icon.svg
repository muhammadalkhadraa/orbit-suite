<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4" />

  <!-- Outer Orbit Track -->
  <ellipse cx="256" cy="256" rx="170" ry="170" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="4" />

  <!-- Outer Elliptical Planetary Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="70" fill="none" stroke="url(#orbitGrad1)" stroke-width="8" transform="rotate(-30 256 256)" filter="url(#glow)" />

  <!-- Center Celestial Body -->
  <circle cx="256" cy="256" r="64" fill="url(#orbitGrad1)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="48" fill="#0f172a" />
  <circle cx="256" cy="256" r="28" fill="url(#orbitGrad2)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />

  <!-- Orbiting Satellites -->
  <circle cx="395" cy="175" r="16" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="117" cy="337" r="12" fill="#c084fc" filter="url(#glow)" />
</svg>
